listen=YES
anonymous_enable=NO
local_enable=NO
write_enable=NO
secure_chroot_dir=/var/run/vsftpd/empty
pasv_enable=YES
pasv_min_port=30000
pasv_max_port=30010
# vsftpd 3.0.3 seccomp sandbox kills the session child in containers ("USER" never answered).
seccomp_sandbox=NO
# vsftpd namespaces (isolate) fail inside an unprivileged container.
isolate=NO
isolate_network=NO
