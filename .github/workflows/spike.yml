name: spike
on:
  push:
    branches: [main]
    paths: [spike/**, .github/workflows/spike.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Secrets for this run
        run: bash scripts/make-secrets.sh
      - name: Start Greenbone and the fleet
        run: docker compose -f lab/compose.yaml up -d --build
      - name: Set the admin password
        run: |
          for i in $(seq 1 90); do
            if docker compose -f lab/compose.yaml exec -T -u gvmd gvmd gvmd --get-users 2>/dev/null | grep -qx admin; then break; fi
            sleep 10
          done
          docker compose -f lab/compose.yaml exec -T -u gvmd gvmd gvmd --user=admin --new-password="$GVM_PASSWORD" >/dev/null
      - name: Scan v1
        run: >-
          docker compose -f lab/compose.yaml --profile tools run --rm runner
          vulnmgmt scan --assets /policy/assets.csv --key /out/keys/scan_key --name v1 --out /out/report-v1.xml
      - name: Fleet still running
        if: always()
        run: docker compose -f lab/compose.yaml ps -a web files db
      - name: SSH on the hosts
        if: always()
        run: |
          for h in web files db; do
            echo "== $h"; docker compose -f lab/compose.yaml logs --tail 20 "$h"; docker compose -f lab/compose.yaml exec -T "$h" sh -c 'cat /var/log/sshd.log; ps -ef; getent passwd scan; grep "^scan:" /etc/shadow'
          done
      - name: gvmd refs table
        if: always()
        run: |
          psql() { docker compose -f lab/compose.yaml exec -T -u postgres pg-gvm psql -d gvmd -At -c "$1"; }
          psql "SELECT type, count(*) FROM vt_refs GROUP BY type ORDER BY 2 DESC LIMIT 8;" || true
          psql "SELECT count(*) FROM nvts;" || true
          psql "SELECT count(*) FROM nvts WHERE oid LIKE '1.3.6.1.4.1.25623.1.1.1.2.%';" || true
          psql "SELECT vt_oid, type, ref_id FROM vt_refs WHERE vt_oid IN ('1.3.6.1.4.1.25623.1.1.1.1.2023.5514', '1.3.6.1.4.1.25623.1.0.108842') AND type = 'cve';" || true
          psql "SELECT name, value FROM meta WHERE name LIKE '%nvt%' OR name LIKE '%feed%';" || true
      - name: GMP refs on a fresh connection
        if: always()
        run: >-
          docker compose -f lab/compose.yaml --profile tools run --rm -v "$PWD/spike:/spike:ro" runner
          python /spike/diag.py
      - name: gvmd log
        if: always()
        run: docker compose -f lab/compose.yaml logs gvmd 2>&1 | grep -iE "nvti|cache|vt_refs|refs|notus|VTs" | tail -40
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: diag
          path: out/report-v1.xml
          if-no-files-found: ignore
